project:
  type: website
  # only render the landing/about pages and the generated country pages
  render:
    - index.qmd
    - about.qmd
    - "countries/*/index.qmd"
  # files linked from pages (CSV / R downloads) must be copied to _site
  resources:
    - "countries/**/*.csv"
    - "countries/**/*.R"
    - emde_regimes_all.csv

# sidebar contents are generated by build.R
metadata-files:
  - _sidebar.yml

bibliography: err.bib

website:
  title: "EMDE"
  navbar:
    logo: "XKDRORGFILES/XKDR_Logomark_RGB_Full_Colour.png"
    background: primary
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
  sidebar:
    style: "docked"
    background: light

format:
  html:
    theme: default
    css: styles.css
    citations-hover: true
    link-citations: true
